[versions]
# Android SDK versions
compileSdk = "37"
minSdk = "26"
targetSdk = "37"

# App version
versionCode = "63"
versionName = "2.1.45"

# Build tools
androidGradlePlugin = "9.3.2"

# Core dependencies
sshd = "2.19.0"
slf4j = "2.0.18"
bouncycastle-provider = "1.85.2"
bouncycastle-bcpkix = "1.85"

# Android libraries
material = "1.14.0"

# Crash reporting
acra = "5.13.1"

# Testing libraries
junit = "6.1.3"
hamcrest = "1.3"
mockito = "5.23.0"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

[libraries]

# Android libraries
android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Crash reporting libraries
acra-core = { group = "ch.acra", name = "acra-core", version.ref = "acra" }
acra-mail = { group = "ch.acra", name = "acra-mail", version.ref = "acra" }
acra-toast = { group = "ch.acra", name = "acra-toast", version.ref = "acra" }

# SSH and crypto libraries
sshd-core = { group = "org.apache.sshd", name = "sshd-core", version.ref = "sshd" }
sshd-sftp = { group = "org.apache.sshd", name = "sshd-sftp", version.ref = "sshd" }
sshd-contrib = { group = "org.apache.sshd", name = "sshd-contrib", version.ref = "sshd" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-log4j12 = { group = "org.slf4j", name = "slf4j-log4j12", version.ref = "slf4j" }
bouncycastle-jdk18on = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle-provider" }
bouncycastle-jbcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle-bcpkix" }

# Testing libraries
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
hamcrest-all = { group = "org.hamcrest", name = "hamcrest-all", version.ref = "hamcrest" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }

# Android testing libraries
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[bundles]
# Bundle related dependencies together
sshd = ["sshd-core", "sshd-sftp", "sshd-contrib"]
slf4j = ["slf4j-api", "slf4j-log4j12"]
crypto = ["bouncycastle-jdk18on", "bouncycastle-jbcpkix"]
acra = ["acra-core", "acra-mail", "acra-toast"]
junit-testing = ["junit-jupiter-api", "junit-jupiter-params", "hamcrest-all", "mockito-core", "mockito-junit-jupiter"]
junit-runtime = ["junit-jupiter-engine", "junit-platform-launcher"]
androidx-testing = ["androidx-test-core", "androidx-test-junit", "androidx-test-runner", "androidx-test-espresso-core"]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
